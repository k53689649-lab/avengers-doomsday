    <path d="M150 400 H450 M300 260 V600" stroke-width="5" opacity=".5"/>
    <circle cx="375" cy="330" r="26" fill="#e23636" opacity=".6" stroke="none"/></g></g>
  <rect width="600" height="900" fill="url(#foot)"/>
  <rect width="600" height="7" fill="#7a8894"/>
  <rect width="600" height="900" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="599" height="899" fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <text x="52" y="700" font-size="62" font-weight="900"
