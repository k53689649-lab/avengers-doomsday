  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <path d="M0 900 L600 378 L600 900 Z" fill="url(#plane)"/>
  <path d="M0 648 L600 270 L600 270 L0 648 Z" fill="#e23636" opacity=".10"/>
  <g><g fill="none" stroke="#e23636" opacity=".7">
